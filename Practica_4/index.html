<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>
<body>
    <section class="container mt-5">
         <article class="col-sm-4">
            <h3>Promedio de muertes en 7 dias</h3>       
            <button type="button" class="btn btn-outline-info" onclick="cargar()">Capturar cantidad de muertos por dia </button>
            <hr>
          <p id="promedio"></p>
          </article>
    </section>



    <section class="container mt-5">
    <h3>Letra E</h3>
    <article id="letraF"></article>
    <button class="btn btn-outline-info" type="button" onclick="dibujarF()">Dibujar E</button>
     <h1 id="impF"></h1>
    </section>


    <section class="container mt-5">
    <h3>Cálculo de sueldo</h3>

    <table class="table table-info table-hover">
    <thead>
        <tr>
            <th></th>
            <th>Newbar</th>
            <th>Jr</th>
            <th>Sr</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Diseñador</td>
            <td>120</td>
            <td>120</td>
            <td>240</td>
        </tr>

        <tr>
            <td>Programador</td>
            <td>180</td>
            <td>280</td>
            <td>520</td>
        </tr>

        <tr>
            <td>Lider</td>
            <td>240</td>
            <td>340</td>
            <td>890</td>
        </tr>
    </tbody>
</table>

    <form action="#">
        <label>Puesto</label>
        <select id="puesto" class="form-control">
            <option value="0">Diseñador</option>
            <option value="1">Programador</option>
            <option value="2">Líder</option>
        </select>

        <br>

        <label>Nivel</label>
        <select id="nivel" class="form-control">
            <option value="0">Nivel 1</option>
            <option value="1">Nivel 2</option>
            <option value="2">Nivel 3</option>
        </select>

        <br>

        <label>Horas trabajadas</label>
        <input type="number" id="hrs" class="form-control">

        <br>

        <button type="button" class="btn btn-outline-info" onclick="calcularSueldo()">
            Calcular sueldo
        </button>
    </form>

    <br>

    <h4 id="total"></h4>
</section>


<section class="container mt-5">
    <h3>Agenda</h3>

    
        <table class="table table-info table-hover">
    <thead>
        <tr>
            <th>Día</th>
            <th>Hora</th>
            <th>Evento</th>
            <th>Descripción</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Lunes</td>
            <td id="hora0"></td>
            <td id="evento0"></td>
            <td id="descripcion0"></td>
        </tr>

        <tr>
            <td>Martes</td>
            <td id="hora1"></td>
            <td id="evento1"></td>
            <td id="descripcion1"></td>
        </tr>

        <tr>
            <td>Miércoles</td>
            <td id="hora2"></td>
            <td id="evento2"></td>
            <td id="descripcion2"></td>
        </tr>

        <tr>
            <td>Jueves</td>
            <td id="hora3"></td>
            <td id="evento3"></td>
            <td id="descripcion3"></td>
        </tr>

        <tr>
            <td>Viernes</td>
            <td id="hora4"></td>
            <td id="evento4"></td>
            <td id="descripcion4"></td>
        </tr>

        <tr>
            <td>Sábado</td>
            <td id="hora5"></td>
            <td id="evento5"></td>
            <td id="descripcion5"></td>
        </tr>

        <tr>
            <td>Domingo</td>
            <td id="hora6"></td>
            <td id="evento6"></td>
            <td id="descripcion6"></td>
        </tr>
    </tbody>
</table>
    </thead>
    <tbody id="impAgenda">
    </tbody>

    <label>Día</label>
    <select id="dia" class="form-control">
        <option value="0">Lunes</option>
        <option value="1">Martes</option>
        <option value="2">Miércoles</option>
        <option value="3">Jueves</option>
        <option value="4">Viernes</option>
        <option value="5">Sábado</option>
        <option value="6">Domingo</option>
    </select>

    <br>

    <label>Hora</label>
    <input type="text" id="hora" class="form-control">

    <br>

    <label>Evento</label>
    <input type="text" id="evento" class="form-control">

    <br>

    <label>Descripción</label>
    <input type="text" id="descripcion" class="form-control">

    <br>

    <button class="btn btn-outline-info" onclick="registrarAgenda()">
        Registrar evento
    </button>
<article id="impAgenda"></article>
</section>
    <script src="arreglo.js"></script>
</body>
</html>
